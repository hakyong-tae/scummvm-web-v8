<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lure of the Temptress</title>
<style>
  @font-face{font-family:'NeoDGM';src:url('/fonts/neodgm.woff2') format('woff2');font-display:block}
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative}
  canvas#canvas{display:block;image-rendering:pixelated;background:#000}
  #textlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #textlayer span{position:absolute;white-space:pre;line-height:1;font-family:'NeoDGM',monospace}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000}
  #start[hidden]{display:none}
  #start button{font-size:20px;padding:14px 40px;cursor:pointer}
  #status{font-size:12px;color:#888;min-height:1.2em}
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div id="textlayer"></div>
    </div>
  </div>
  <div id="start">
    <button id="startBtn" disabled>불러오는 중…</button>
    <div id="status"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
