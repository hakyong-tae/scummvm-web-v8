<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Verse8 호스팅 규약: 플랫폼이 iframe 크기를 이 핸드셰이크로 정한다. 없으면 기본 크기로 잘림. -->
<script>
(function () {
  function reportGameSize() {
    try {
      window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE',
        height: Math.max(document.body ? document.body.scrollHeight : 0, document.documentElement.scrollHeight),
        width: Math.max(document.body ? document.body.scrollWidth : 0, document.documentElement.scrollWidth) }, '*')
    } catch (e) {}
  }
  window.addEventListener('load', reportGameSize)
  window.addEventListener('resize', reportGameSize)
  window.addEventListener('message', function (ev) { if (ev.data && ev.data.type === 'REQUEST_GAME_SIZE') reportGameSize() })
})()
</script>
<title>Lure of the Temptress (한글판)</title>
<style>
  @font-face{font-family:'NeoDGM';src:url('fonts/neodgm.woff2') format('woff2');font-display:block}
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative}
  canvas#canvas{display:block;image-rendering:pixelated;background:#000}
  #textlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #textlayer span{position:absolute;white-space:pre;line-height:1;font-family:'NeoDGM',monospace}
  #textlayer .ko{position:absolute;white-space:pre;font-family:'NeoDGM',monospace;text-shadow:0 0 0 currentColor}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#000}
  #start[hidden]{display:none}
  #start button{font-size:20px;padding:14px 40px;cursor:pointer}
  #status{font-size:12px;color:#888;min-height:1.2em}
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div id="textlayer"></div>
    </div>
  </div>
  <div id="start">
    <button id="startBtn" disabled>불러오는 중…</button>
    <div id="status"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
