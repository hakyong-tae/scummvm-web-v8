<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<!-- Verse8 호스팅 규약: 플랫폼이 iframe 크기를 이 핸드셰이크로 정한다. 없으면 기본 크기로 잘림. -->
<script>
(function () {
  function reportGameSize() {
    try {
      window.parent.postMessage({ type: 'GAME_SIZE_RESPONSE',
        height: Math.max(document.body ? document.body.scrollHeight : 0, document.documentElement.scrollHeight),
        width: Math.max(document.body ? document.body.scrollWidth : 0, document.documentElement.scrollWidth) }, '*')
    } catch (e) {}
  }
  window.addEventListener('load', reportGameSize)
  window.addEventListener('resize', reportGameSize)
  window.addEventListener('message', function (ev) { if (ev.data && ev.data.type === 'REQUEST_GAME_SIZE') reportGameSize() })
})()
</script>
<title>Lure of the Temptress (한글판)</title>
<style>
  @font-face{font-family:'NeoDGM';src:url('fonts/neodgm.woff2') format('woff2');font-display:block}
  html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative}
  canvas#canvas{display:block;image-rendering:pixelated;background:#000;outline:none}
  #textlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #textlayer span{position:absolute;white-space:pre;line-height:1;font-family:'NeoDGM',monospace}
  #textlayer .ko{position:absolute;white-space:pre;font-family:'NeoDGM',monospace;text-shadow:0 0 0 currentColor}
  #touchpad{position:absolute;inset:0;touch-action:none;display:none}
  /* 대화 선택지 강조(터치 기기): 트랙패드 위층에 탭 가능한 버튼으로 얹음 */
  #choices{position:absolute;inset:0;pointer-events:none}
  #choices button{position:absolute;pointer-events:auto;font-family:'NeoDGM',monospace;text-align:left;background:rgba(20,14,6,.92);color:#f1dfa8;border:2px solid #c99b3a;border-radius:6px;padding:0 10px;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 2px 10px rgba(0,0,0,.6);cursor:pointer;white-space:nowrap;animation:choicePulse 1.2s ease-in-out infinite alternate}
  #choices button::before{content:'▶ ';color:#e8c56a}
  @keyframes choicePulse{from{border-color:#c99b3a}to{border-color:#fff3c4}}
  #touchpad.on{display:block}
  #hud{position:fixed;top:6px;right:8px;display:flex;gap:6px;z-index:5}
  #hud[hidden]{display:none}
  #hud button{background:rgba(0,0,0,.55);color:#ccc;border:1px solid #444;border-radius:6px;font-size:13px;padding:4px 8px;cursor:pointer}
  #cloud{font-size:11px;color:#888;background:rgba(0,0,0,.55);border-radius:6px;padding:5px 8px}
  #cloud.idle{color:#7fc97f}#cloud.error{color:#e07070}#cloud.syncing{color:#e0c060}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,#1a1208 0%,#000 70%);z-index:10}
  #start[hidden]{display:none}
  #start h1{font-family:'NeoDGM',serif;font-size:clamp(22px,5vw,40px);margin:0;color:#e8c56a;text-shadow:0 2px 0 #3a2a05}
  #start .sub{color:#a89468;font-size:13px;letter-spacing:1px;margin-top:-6px}
  #start .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #start button{font-size:17px;padding:12px 28px;cursor:pointer;background:#2b2010;color:#f1dfa8;border:1px solid #6b5426;border-radius:8px}
  #start button.primary{font-size:20px;padding:14px 44px;background:#5a3f12;border-color:#c99b3a}
  #start button:disabled{opacity:.5;cursor:default}
  #status{font-size:12px;color:#777;min-height:1.2em}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:20;font-size:18px;text-align:center;padding:24px}
  @media (orientation:portrait) and (pointer:coarse){#rotate.armed{display:flex}}
  #settings{position:fixed;top:44px;right:8px;background:rgba(10,10,10,.95);border:1px solid #444;border-radius:8px;padding:10px 12px;z-index:6;font-size:13px;display:none;min-width:200px}
  #settings.on{display:block}
  #settings label{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
  #settings select,#settings button{font-size:13px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal-box{background:#151210;border:1px solid #6b5426;border-radius:10px;max-width:640px;max-height:90vh;overflow:auto;padding:18px 20px;font-size:14px;line-height:1.55}
  .modal-box h2{margin:0 0 10px;color:#e8c56a;font-size:18px}
  .modal-box pre{white-space:pre-wrap;font-size:11px;color:#aaa;background:#0b0a09;padding:10px;border-radius:6px}
  .modal-box a{color:#e8c56a}
  .modal-box .close{margin-top:10px;padding:8px 18px;cursor:pointer}
  #quit{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;z-index:25}
  #quit.on{display:flex}
  #quit button{font-size:18px;padding:12px 32px;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(10,10,10,.92);color:#f1dfa8;border:1px solid #6b5426;border-radius:8px;padding:10px 16px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
  #toast[hidden]{display:none}
  .touch-only{display:none}
  body.touch .touch-only{display:inline-block}
  #yn{position:fixed;left:50%;top:62%;transform:translateX(-50%);display:flex;gap:14px;z-index:7}
  #yn[hidden]{display:none}
  #yn button{font-size:20px;padding:12px 34px;cursor:pointer;background:#2b2010;color:#f1dfa8;border:1px solid #c99b3a;border-radius:8px}
  #kbd{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);z-index:8}
  #kbd[hidden]{display:none}
  .kbd-box{background:#151210;border:1px solid #6b5426;border-radius:10px 10px 0 0;padding:12px 14px;width:min(520px,100%);display:flex;flex-direction:column;gap:8px;font-size:14px}
  .kbd-box input{font-size:18px;padding:8px}
  .kbd-box .row{display:flex;gap:8px;flex-wrap:wrap}
  .kbd-box button{font-size:15px;padding:8px 14px}
  .modal-box details{margin:6px 0}.modal-box summary{cursor:pointer;color:#e8c56a}.modal-box ol{margin:6px 0 10px}
  /* 홍보 녹화 모드(?promo=1): 정방형 화면 위아래에 제목/문구 */
  #promo{position:fixed;inset:0;pointer-events:none;display:none;z-index:4;font-family:'NeoDGM',serif;text-align:center}
  #promo.on{display:block}
  #promo .pt{position:absolute;left:0;right:0;top:6%;font-size:64px;color:#e8c56a;text-shadow:0 4px 0 #3a2a05,0 0 24px rgba(232,197,106,.35)}
  #promo .ps{position:absolute;left:0;right:0;top:calc(6% + 78px);font-size:26px;color:#bfa66a;letter-spacing:2px}
  #promo .pb{position:absolute;left:0;right:0;bottom:7%;font-size:30px;color:#ddd;letter-spacing:1px}
  #promo .pb b{color:#e8c56a}
</style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <div id="textlayer"></div>
      <div id="touchpad"></div>
      <div id="choices"></div>
    </div>
  </div>
  <div id="hud" hidden>
    <span id="cloud" class="offline" data-ui="cloudLocal">저장: 로컬</span>
    <button id="btnHints" data-ui="hints">💡 힌트</button>
    <button id="btnEsc" class="touch-only" data-ui="esc">Esc</button>
    <button id="btnKbd" class="touch-only" data-ui="keyboard">⌨ 입력</button>
    <button id="btnSettings" data-ui-title="settings" title="설정">⚙</button>
    <button id="btnInfo" data-ui-title="info" title="정보/라이선스">ⓘ</button>
  </div>
  <!-- 엔진의 y/n 확인창("Are you sure (y/n)?")은 키보드 전용 → 터치용 버튼 -->
  <div id="yn" hidden><button id="ynYes" data-ui="yes">예</button><button id="ynNo" data-ui="no">아니오</button></div>
  <!-- 세이브 이름 등 텍스트 입력(터치 기기): 글자를 한 자씩 엔진에 보낸다 -->
  <div id="kbd" hidden><div class="kbd-box"><div data-ui="kbdTitle">게임에 글자 입력</div><input id="kbdInput" maxlength="20" autocomplete="off" spellcheck="false"><div class="row"><button id="kbdSend" data-ui="kbdSend">입력</button><button id="kbdEnter" data-ui="kbdEnter">Enter</button><button id="kbdBack">⌫</button><button id="kbdClose" data-ui="kbdClose">닫기</button></div></div></div>
  <div id="settings">
    <label><span data-ui="touchMode">터치 조작</span> <select id="selTouch"><option value="trackpad" data-ui="touchTrackpad">트랙패드(드래그로 커서)</option><option value="direct" data-ui="touchDirect">직접 탭</option></select></label>
    <label><span data-ui="subtitles">자막</span> <select id="selLang"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <div style="color:#888;font-size:11px;margin-top:6px" id="controlsHelp"></div>
  </div>
  <div id="start">
    <h1 id="title">Lure of the Temptress</h1>
    <div class="sub" id="subtitle" data-ui="subtitle">유혹의 마녀 · 1992 Revolution Software · 비공식 한글판</div>
    <div class="row">
      <button id="startBtn" class="primary" disabled>불러오는 중…</button>
    </div>
    <div class="row">
      <button id="langBtn" data-ui="langBtn">자막: 한국어</button>
      <button id="infoBtn" data-ui="info">정보 / 라이선스</button>
    </div>
    <div id="status"></div>
  </div>
  <div id="rotate"><span data-ui="rotate">가로로 돌려 주세요</span><br><small style="color:#999" data-ui="rotateSub">이 게임은 가로 화면에 맞춰져 있습니다</small></div>
  <div id="promo"><div class="pt">Lure of the Temptress</div><div class="ps">유혹의 마녀 · 한글판</div><div class="pb">설치 없이 · <b>한글 자막</b> · 폰에서도 · 클라우드 세이브</div></div>
  <div id="toast" hidden></div>
  <div id="quit"><div data-ui="quit">게임을 종료했습니다.</div><button id="restartBtn" data-ui="restart">다시 시작</button></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
